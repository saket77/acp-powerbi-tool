<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Databook Portal</title>
<style>
:root{
  --ink:#172033; --muted:#5b6477; --faint:#8b93a5; --line:#e3e6ec; --line2:#d3d8e0; --bg:#f3f4f7; --card:#ffffff; --soft:#f7f8fa;
  --side:#0f2a40; --side-ink:#c3d1de; --navy:#12324d;
  --accent:#1d5c8c; --accent-soft:#e8f0f7; --accent-ink:#154769;
  --good:#287a49; --good-soft:#e5f3ea; --warn:#93570a; --warn-soft:#fcf0db; --bad:#ad2a20; --bad-soft:#fbe8e6;
  --robot:#5a4ab4; --robot-soft:#efedfb; --pbi:#e8b100; --teal:#2a8f86;
  --radius:10px; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:600;font-size:15px;padding:0 8px 10px}
.side .brand small{display:block;font-weight:400;font-size:12px;color:#8fa6ba}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;flex:none}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7891a7;padding:16px 10px 6px}
.side nav button{display:block;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;text-align:left}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--pbi)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.top h1{font-size:19px;margin:0;font-weight:650}
.spacer{flex:1}
.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin:0}
.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:20px 24px 40px;max-width:1480px;width:100%}
.content.nonotes{grid-template-columns:minmax(0,1fr)}
.content.nonotes #notes{display:none}
@media (max-width:1150px){.content{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:10px 12px}
  .side .grp{display:none}
  .side nav{display:flex;flex-wrap:wrap;gap:4px}
  .side nav button{width:auto;padding:6px 10px}
  .top{position:static;padding:12px 16px}
  .content{padding:16px}
}
/* tour */
.tour{background:#14324a;color:#fff;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.tour .n{font-size:12px;color:#b9cbd9;white-space:nowrap}
.tour .tt{font-weight:600}
.tour .tx{font-size:13px;color:#dfe8ef;flex:1 1 320px}
.tour .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.tour .btn:hover{border-color:#fff}
.tour .btn.primary{background:#fff;color:#14324a;border-color:#fff}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.3)}
.dots button.on{background:var(--pbi)}
/* basics */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:16px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h3{font-size:13.5px;margin:14px 0 6px;font-weight:600;color:var(--muted)}
.h{font-size:18px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:13px}
.lead{font-size:15px;color:var(--muted);max-width:74ch;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;white-space:nowrap}
.btn:hover{border-color:#b9c0cb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.btn.small{padding:3px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.tot td{font-weight:600}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;white-space:nowrap;vertical-align:1px}
.b-live,.b-easy,.b-ok{background:var(--good-soft);color:var(--good)}
.b-draft,.b-info{background:var(--accent-soft);color:var(--accent-ink)}
.b-ended,.b-role{background:#eef0f3;color:var(--muted)}
.b-warn,.b-medium{background:var(--warn-soft);color:var(--warn)}
.b-bad,.b-tricky{background:var(--bad-soft);color:var(--bad)}
.b-lead{background:#14324a;color:#fff}
.b-restricted{background:#2b2140;color:#fff}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.avatar.c{background:#fff3d6;color:#7a5400}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .h{font-size:12px;color:var(--faint)}
.msg{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13.5px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.info{background:var(--accent-soft);color:var(--accent-ink)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.empty{color:var(--faint);font-size:13px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state .big{font-size:17px;color:var(--ink);font-weight:600;margin-bottom:4px}
.foot{font-size:12px;color:var(--faint);margin:14px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],select{width:100%;padding:8px 10px;border:1px solid #cfd4dc;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
select.mini{width:auto;padding:4px 8px;font-size:13px}
.err{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:1em}
.cbx{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ink);font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:6px 14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.seg.wide{display:flex;margin:12px 0 4px}
.seg.wide button{flex:1}
code{font-family:var(--mono);font-size:11.5px;background:#fff;padding:0 4px;border-radius:4px;overflow-wrap:anywhere;border:1px solid var(--line)}
/* portal app frame */
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:visible}
.app-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:#fbfcfd;border-radius:12px 12px 0 0;position:relative}
.app-bar .name{font-weight:650}
.app-bar .logo{width:26px;height:26px;font-size:10px;border-radius:7px}
.app-bar .ctx{color:var(--faint);font-size:13px}
.app-tabs{display:flex;gap:2px;margin-left:8px}
.app-tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted)}
.app-tabs button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.app-body{padding:18px}
.crumbs{margin-bottom:10px;font-size:13px;color:var(--faint)}
.crumbs button{background:none;border:0;padding:0;color:var(--accent)}
.ctxbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#14324a;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.ctxbar b{font-weight:600}
.ctxbar .sep{opacity:.5}
/* client header */
.cl-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;border-radius:12px 12px 0 0;position:relative}
.switch{position:relative}
.switch > button{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);background:#fff;border-radius:20px;padding:5px 12px 5px 14px;font-weight:600}
.switch > button .chev{font-size:10px;color:var(--faint)}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,50,.14);min-width:300px;z-index:15;padding:6px}
.dropdown.right{left:auto;right:0;min-width:200px}
.dropdown button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}
.dropdown button:hover{background:var(--soft)}
.dropdown button.on{background:var(--accent-soft)}
.dropdown .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px 4px}
.welcome{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.welcome .hi{color:#a9c2d6;font-size:14px}
.welcome .pn{font-size:24px;font-weight:650;margin:2px 0 10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.12);border-radius:20px;padding:3px 11px;font-size:12.5px;color:#e4edf4}
.contact{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;font-size:13px;min-width:220px}
.contact b{display:block;color:#fff}
.contact span{color:#c2d4e2}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kcard .l{font-size:12.5px;color:var(--muted)}
.kcard .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.kcard .u{font-size:12px;color:var(--faint)}
.kcard .d{font-size:12px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--good)} .down{color:var(--bad)}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rcard .th{background:#f4f7fa;border-bottom:1px solid var(--line);display:block}
.rcard .th svg{display:block;width:100%;height:auto}
.rcard .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.rcard .bd b{font-size:14px}
.rcard .bd .meta{font-size:12px;color:var(--faint);margin-top:auto;padding-top:8px}
.rcard .new{position:relative}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.section-h h2{margin:0}
/* concept strip */
.concept{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#fff8e6;border:1px dashed #e7c46a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#6b4e00}
.concept .seg button{padding:3px 10px;font-size:12.5px}
/* project page */
.people{list-style:none;margin:0 0 10px;padding:0}
.people li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.people .who{flex:1;min-width:0}
.people .who .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.drop{border:1.5px dashed #9fb8cc;border-radius:10px;padding:18px;text-align:center;background:#fafcfe;transition:background .15s}
.drop.over{background:var(--accent-soft)}
.checks{list-style:none;padding:0;margin:12px 0 0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13.5px}
.ic{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ic.ok{background:var(--good-soft);color:var(--good)}
.ic.no{background:var(--bad-soft);color:var(--bad)}
.ic.wait{border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.ic.todo{border:2px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ic.wait{animation:none}}
.versions{font-size:13px;color:var(--muted);margin-top:8px}
.picks{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:190px;overflow:auto}
.pick{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;text-align:left}
.pick:hover{background:var(--soft)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.selbox{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--soft)}
.rights{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.right{font-size:12px;padding:2px 9px;border-radius:20px}
.right.yes{background:var(--good-soft);color:var(--good)}
.right.no{background:#eef0f3;color:var(--faint)}
.fresh{font-size:11.5px;padding:1px 8px;border-radius:20px}
/* report frame */
.rv-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.fbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);margin-bottom:10px}
.slicer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.pill{border:1px solid var(--line2);background:#fff;border-radius:16px;padding:2px 11px;font-size:12.5px;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:#eef0f3;padding:3px 11px;border-radius:20px;color:var(--muted)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0;overflow-x:auto}
.ptabs button{border:0;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--pbi);font-weight:600}
.acp{font-size:10.5px;background:var(--warn-soft);color:var(--warn);padding:0 6px;border-radius:10px;margin-left:6px;font-weight:500;white-space:nowrap}
.canvas{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:16px 18px;background:#fff;position:relative;min-height:260px}
.hl .zone-portal{outline:2px dashed var(--accent);outline-offset:3px;position:relative}
.hl .zone-pbi{outline:2px dashed var(--pbi);outline-offset:-2px}
.zone-tag{display:none;position:absolute;top:-10px;right:10px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.hl .zone-tag{display:block}
.zone-portal > .zone-tag{background:var(--accent);color:#fff}
.zone-pbi > .zone-tag{background:var(--pbi);color:#3d2e00;top:8px}
.chart text{font-size:11px;fill:var(--muted)}
.chart .val{font-size:10.5px;fill:var(--ink)}
.hb{display:grid;grid-template-columns:170px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hb .track{height:12px;background:#eef1f5;border-radius:6px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}
.sel-col{background:#fbf6e3}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:240px;color:var(--muted)}
.state .big{font-size:16px;color:var(--ink);font-weight:600}
.skel{background:linear-gradient(90deg,#eef1f5 0%,#f7f9fb 50%,#eef1f5 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:760px){.hb{grid-template-columns:110px minmax(0,1fr) 80px}.welcome .pn{font-size:20px}}
/* sign-in (External ID look) */
.signin{max-width:400px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px}
.signin .brandrow{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-weight:650}
.signin .sec{font-size:11.5px;color:var(--faint);margin-top:16px;text-align:center}
.msbtn{display:flex;width:100%;gap:10px;align-items:center;justify-content:center;border:1px solid #8c8c8c;background:#fff;color:#5e5e5e;font-weight:600;padding:9px 12px;border-radius:4px;margin-top:16px}
.msbtn:hover{background:#f3f3f3}
.msgrid{display:inline-grid;grid-template-columns:9px 9px;gap:2px}
.msgrid i{width:9px;height:9px;display:block}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:16px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* info pages */
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.journey button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px;text-align:left;font-size:13px}
.journey button:hover{border-color:var(--accent)}
.journey button b{display:block;color:var(--accent-ink);font-size:12px;font-weight:600}
.role-card ul{margin:6px 0 12px;padding-left:18px;font-size:13.5px}
.arch-wrap{overflow-x:auto}
.arch-wrap svg{min-width:640px;display:block}
.steps{margin:10px 0 0;padding-left:20px;font-size:13.5px}
.steps li{margin:3px 0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;margin-top:8px}
.flow .st{flex:1 1 130px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;position:relative;margin:0 14px 10px 0}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;border:6px solid transparent;border-left-color:var(--faint);transform:translateY(-50%)}
.flow .st b{display:block;font-size:13px}
.flow .st span{font-size:12px}
.flow .st .ico{margin-bottom:4px}
.flow .st.me{background:#fff8e6;border-color:#f0d58a}
.flow .st.auto{background:var(--robot-soft);border-color:#d6d0f3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pbisvc{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pbisvc .bar{background:#252423;color:#fff;font-size:13px;padding:8px 14px;display:flex;gap:10px;align-items:center}
.ico{display:inline-block;vertical-align:middle;flex:none}
.techs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}
.tech{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:13px}
.tech b{display:block;font-size:13px}
.tech span{color:var(--muted);font-size:12px}
.walls{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wall{display:grid;grid-template-columns:34px 190px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.wall .n{width:28px;height:28px;border-radius:50%;background:#14324a;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.wall b{font-size:13.5px}
.wall span{font-size:13px;color:var(--muted)}
@media (max-width:700px){.wall{grid-template-columns:34px minmax(0,1fr)}.wall span{grid-column:2}}
.lc{list-style:none;margin:0;padding:0}
.lc-phase{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.lc li{display:grid;grid-template-columns:30px minmax(0,1fr) 130px;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.lc .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.lc .who{font-size:12px;padding:2px 9px;border-radius:20px;text-align:center;justify-self:end;white-space:nowrap}
.k-acp .no,.k-acp .who{background:#fff3d6;color:#7a5400}
.k-client .no,.k-client .who{background:#e3f1f6;color:#0d5c74}
.k-auto .no,.k-auto .who{background:var(--robot-soft);color:var(--robot)}
.lc .d{font-size:12.5px;color:var(--muted)}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%}
@media (max-width:640px){.lc li{grid-template-columns:30px minmax(0,1fr)}.lc .who{grid-column:2;justify-self:start}}
/* notes */
#notes{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
#notes h2{display:flex;align-items:center;gap:8px}
.robot{width:24px;height:22px;border-radius:6px;background:var(--robot);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.note{border-left:3px solid var(--robot);background:var(--robot-soft);border-radius:0 8px 8px 0;padding:8px 10px;margin-bottom:10px}
.note .t{font-weight:600;font-size:13px;color:var(--robot)}
.note ul{margin:4px 0 0;padding-left:16px;font-size:12.5px}
/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(20,26,38,.42);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:12px;max-width:500px;width:100%;padding:20px 22px;max-height:90vh;overflow:auto}
.modal .actions{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:30;max-width:90vw}

/* ---------- finance maths ---------- */
function agg(companies){
  const sum = (k, i) => companies.reduce((s, c) => s + fin[c][k][i], 0);
  const out = { rev:[], mat:[], pers:[], oth:[], ebitda:[], monthly:[], bs:{} };
  for (let i = 0; i < 3; i++){ ['rev','mat','pers','oth'].forEach(k => out[k].push(sum(k, i))); out.ebitda.push(out.rev[i] + out.mat[i] + out.pers[i] + out.oth[i]); }
  for (let m = 0; m < 12; m++) out.monthly.push(companies.reduce((s, c) => s + fin[c].monthly[m], 0));
  ['fa','inv','rec','cash','eq','debt','pay'].forEach(k => out.bs[k] = companies.reduce((s, c) => s + fin[c].bs[k], 0));
  return out;
}
function bsFor(d, y){ const f = d.rev[y] / d.rev[2], b = {}; Object.keys(d.bs).forEach(k => b[k] = d.bs[k] * f); return b; }
function kpiSet(codes){
  const d = agg(names(codes)), y = 2, b = bsFor(d, y), nwc = b.inv + b.rec - b.pay;
  const chg = (a, p) => (a / p - 1) * 100;
  const d1 = agg(names(codes)), b1 = bsFor(d1, 1), nwc1 = b1.inv + b1.rec - b1.pay;
  return [
    { l:'Revenue', v:fmt(d.rev[y]), u:'EUR m, FY2025', ch:chg(d.rev[y], d.rev[y - 1]), s:d.monthly },
    { l:'EBITDA', v:fmt(d.ebitda[y]), u:`EUR m, margin ${fmt(d.ebitda[y] / d.rev[y] * 100)} %`, ch:chg(d.ebitda[y], d.ebitda[y - 1]), s:d.monthly.map(v => v * d.ebitda[y] / d.rev[y]) },
    { l:'Net working capital', v:fmt2(nwc / (d.rev[y] / 12)), u:'months of revenue', ch:null, s:NWC_SEASON },
    { l:'Net debt / EBITDA', v:fmt2((b.debt - b.cash) / d.ebitda[y]) + 'x', u:`net debt EUR ${fmt(b.debt - b.cash)} m`, ch:null, s:null },
    { l:'Cash', v:fmt(b.cash), u:'EUR m at year end', ch:chg(b.cash, b1.cash), s:null }
  ];
}
function kpiCards(codes){
  return `<div class="kcards">${kpiSet(codes).map(k => `<div class="kcard"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="u">${k.u}</div>
    <div class="d">${k.ch === null ? '<span class="sub">&nbsp;</span>' : `<span class="${k.ch >= 0 ? 'up' : 'down'}">${k.ch >= 0 ? '&#9650;' : '&#9660;'} ${fmt(Math.abs(k.ch))} % vs FY2024</span>`}${k.s ? spark(k.s) : ''}</div></div>`).join('')}</div>`;
}

/* ---------- small charts ---------- */
function bars(vals, labels, label, fmtv){
  const W = 640, H = 220, L = 8, T = 18, B = 24, max = Math.max(...vals) * 1.15 || 1, bw = (W - L) / vals.length;
  const grid = [0.25, 0.5, 0.75, 1].map(f => { const y = H - B - f * (H - B - T); return `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#eef0f4"/>`; }).join('');
  const marks = vals.map((v, i) => { const h = v / max * (H - B - T), x = L + i * bw + bw * 0.18, w = bw * 0.64, y = H - B - h;
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#1d5c8c"><title>${labels[i]}: ${fmtv(v)}</title></rect><text class="val" x="${x + w / 2}" y="${y - 5}" text-anchor="middle">${fmtv(v)}</text><text x="${x + w / 2}" y="${H - 7}" text-anchor="middle">${labels[i]}</text></g>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">${grid}<line x1="${L}" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="#c9cfd8"/>${marks}</svg>`;
}
function hbars(items){
  const max = Math.max(...items.map(x => x[1])) || 1;
  return items.map(([n, v]) => `<div class="hb"><span>${esc(n)}</span><span class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="v">EUR ${fmt(v)} m</span></div>`).join('');
}
function spark(arr){
  const W = 80, H = 24, max = Math.max(...arr), min = Math.min(...arr), rng = max - min || 1;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * (W - 4) + 2).toFixed(1)},${(H - 3 - (v - min) / rng * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend"><polyline points="${pts}" fill="none" stroke="#1d5c8c" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

  }
  if (page === 'cf'){
    const cfo = d.ebitda[y] - 0.012 * d.rev[y], cfi = -0.06 * d.rev[y], cff = -0.04 * d.rev[y];

  }
  if (page === 'nwc'){
    return `<div class="grid2"><div class="tbl-wrap"><table><thead><tr><th>Component</th><th class="num">EUR m</th></tr></thead><tbody>
      ${row('Inventories', b.inv)}${row('Trade receivables', b.rec)}${row('Trade payables', -b.pay)}${row('Net working capital', nwc, 'tot')}</tbody></table>

  }

  }
  return `<div class="msg warn" style="margin:0 0 12px">ACP only. Not in the client navigation, and the Client role filters its data to nothing, so opening it through the browser's developer tools shows nothing.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead><tbody>${(o.checks || CHECKS_OK).map(([c, s, t]) => `<tr><td>${c}</td><td><span class="badge ${s ? 'b-live' : 'b-bad'}">${s ? 'OK' : 'Check'}</span></td><td>${t}</td></tr>`).join('')}</tbody></table></div>`;
}

          up.msg = `This file is built on Databook template 1.4. Rebuild it on template ${settings.minTemplate} or newer (it adds the Client and ACP roles and company codes), then drop it again.`;

          render(); return; }

      }, 480);
    } else {
      up.done = true; up.ok = true;
      p.draft = { v:(p.live ? p.live.v : 0) + 1, file, template:settings.minTemplate, asOf:'2026-09-30', uploadedBy:u.email, uploaded:TODAY };

      render();
    }
  };

}

function rollback(i){

function render(){
  $$('.side nav button').forEach(b => b.classList.toggle('on', b.dataset.page === state.page));
  const [t, s] = PAGES[state.page];
  $('#ptitle').textContent = t; $('#psub').textContent = s;
  const tryPage = TRY.includes(state.page);
  $('#notesToggle').hidden = !tryPage;
  $('#content').classList.toggle('nonotes', !state.notes || !tryPage);
  const v = { overview:viewOverview, client:viewClient, acp:viewAcp, steps:viewSteps, security:viewSecurity, powerbi:viewPowerBI, automation:viewAutomation, arch:viewArch, maint:viewMaint, plan:viewPlan }[state.page];
  $('#screen').innerHTML = v();
  wireDrop();
}
$$('.side nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
$('#showNotes').addEventListener('change', e => { state.notes = e.target.checked; render(); });
render();
</script>

</body></html>
